{% extends "base.html" %}
{% block title %}新建考试{% endblock %}
{% block body %}
<div class="card">
<div class="page-kicker">{{ icon('sun', 14) }} 一场新考试，马上出发</div>
<h1>新建考试</h1>
<form method="post">
  <div class="row">
    <label>考试名称</label>
    <input type="text" name="title" value="" required style="width:300px" placeholder="例如：期中信息技术考试">
  </div>

  <h2>考试时长</h2>
  <div class="row">
    <label>考试总时长（分钟）</label>
    <input type="number" name="duration" min="1" max="600" value="60" style="width:100px">
    <span class="muted">理论题、实操题共用这一个倒计时，从开考起算</span>
  </div>

  <h2>选择题型（可多选）</h2>
  <p class="muted" style="margin-bottom:12px">勾选本次考试要包含的题型，学生可以按任意顺序完成</p>

  <div class="choice-grid">
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="single" checked style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">单选题</div>
        <div class="muted">计算机基础、WPS知识、程序输出等</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="multi" checked style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">多选题</div>
        <div class="muted">可选多个答案</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="judge" checked style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">判断题</div>
        <div class="muted">判断对错，含程序输出判断</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="blank" checked style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">填空题</div>
        <div class="muted">文字填空</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="code" style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">程序填空题</div>
        <div class="muted">补全代码，可在本地运行验证</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="drag" style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">拖拽题</div>
        <div class="muted">把项目拖到对应格子里（会考常考题型）</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="practice" style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">WPS 操作题</div>
        <div class="muted">Word / Excel / PPT 实操</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="typing" style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">打字练习（小学）</div>
        <div class="muted">打地鼠 / 看键按键(大写) / 小写找键 / 英文·中文打字 / 打名字，
        每一项都能单独开关，参数在「编辑考试」里调整</div>
      </div>
    </label>
    <label class="choice-card">
      <input type="checkbox" name="qtypes" value="drawing" style="width:18px;height:18px">
      <div>
        <div style="font-weight:600">画板创作</div>
        <div class="muted">画笔 / 数学形状 / 电学·网络·化学元件，最后交一张压缩图片，
        放在考试最后进行</div>
      </div>
    </label>
  </div>

  <div id="practice-options" class="surface-soft" style="display:none;margin-bottom:20px;background:var(--sky)">
    <h3 style="margin-top:0">操作题设置（可多选组合）</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <label class="check-chip">
        <input type="checkbox" name="practice_types" value="word" style="width:16px;height:16px">
        <span>WPS 文字（.docx）</span>
      </label>
      <label class="check-chip">
        <input type="checkbox" name="practice_types" value="excel" checked style="width:16px;height:16px">
        <span>WPS 表格（.xlsx）</span>
      </label>
      <label class="check-chip">
        <input type="checkbox" name="practice_types" value="ppt" style="width:16px;height:16px">
        <span>WPS 演示（.pptx）</span>
      </label>
    </div>
    <p class="muted" style="margin:4px 0 0">
      保存文件名由学生端按题型自动生成（座位号_姓名.docx / .xlsx / .pptx），无需老师填写。
    </p>
  </div>

  <h2>其他设置</h2>
  <div class="row">
    <label style="cursor:pointer">
      <input type="checkbox" name="require_complete" value="1">
      未做完禁止提交（理论题必须全部答完才能保存）
    </label>
  </div>

  <div class="bar">
    <button class="btn green lg" type="submit">创建考试</button>
    <a class="btn gray" href="/">返回</a>
  </div>
</form>
</div>

<script>
/* 勾选"操作题"时显示操作题设置 */
document.querySelectorAll('input[name="qtypes"]').forEach(function(cb){
  cb.addEventListener('change', function(){
    var checked = document.querySelector('input[name="qtypes"][value="practice"]:checked');
    document.getElementById('practice-options').style.display = checked ? 'block' : 'none';
  });
});
</script>
{% endblock %}
