<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置初始密码 · ikee考务中心</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;
     background:linear-gradient(135deg,#2c3e50,#3498db);
     min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:10px;padding:38px 40px;width:400px;
      box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{font-size:20px;margin-bottom:6px;text-align:center;color:#2c3e50}
.sub{text-align:center;color:#7f8c8d;font-size:13px;margin-bottom:26px}
input{width:100%;padding:11px 12px;border:1px solid #cbd5e0;border-radius:5px;
      font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:#3498db}
.btn{width:100%;padding:11px;background:#3498db;color:#fff;border:none;
     border-radius:5px;font-size:15px;cursor:pointer;margin-top:16px;font-family:inherit}
.btn:hover{background:#2980b9}
.err{background:#f8d7da;color:#721c24;padding:9px 12px;border-radius:4px;
     font-size:13px;margin-bottom:12px;text-align:center}
.tip{margin-top:18px;font-size:12px;color:#7f8c8d;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>ikee考务中心</h1>
  <div class="sub">首次运行 · 设置初始密码</div>

  {% if err %}<div class="err">{{ err }}</div>{% endif %}

  <form method="post" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input type="password" name="password" placeholder="设置管理密码（至少 6 位）"
           autofocus required>
    <input type="password" name="password2" placeholder="再输入一次确认"
           style="margin-top:10px" required>
    <button class="btn" type="submit">设置并进入</button>
  </form>

  <div class="tip">
    这是进入老师端后台的管理员密码，请妥善保管。<br>
    学生机无需登录，直接运行客户端即可答题。
  </div>
</div>
</body>
</html>
