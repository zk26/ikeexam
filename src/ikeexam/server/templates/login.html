<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · ikee考务中心</title>
<style>
:root{
  --cream:#FCF8F2;--white:#FFFFFF;--navy:#27324A;--muted:#5F6B7D;
  --mint:#E9FBF1;--green:#20C46A;--sky:#E6F7FB;--blue:#38BDF8;
  --coral:#FFB4AA;--danger:#C2414B;--lemon:#F1F9D8;--yellow:#F6C945;
  --lavender:#E6E6FA;--purple:#8B7CF6;--shadow:5px 5px 0 var(--navy);
  --font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;
     font-family:var(--font);background:var(--cream);color:var(--navy);isolation:isolate}
::selection{background:var(--yellow);color:var(--navy)}
.decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.geo{position:absolute;display:block}
.sun{width:86px;height:86px;top:9vh;right:9vw;border:2px solid var(--navy);
     border-radius:50%;background:var(--yellow);box-shadow:var(--shadow)}
.wave{width:150px;height:52px;left:6vw;bottom:9vh;color:var(--coral)}
.dots{width:9px;height:9px;left:10vw;top:25vh;background:var(--purple);
      box-shadow:18px 0 0 var(--purple),36px 0 0 var(--purple),0 18px 0 var(--purple),
                  18px 18px 0 var(--purple),36px 18px 0 var(--purple),
                  0 36px 0 var(--purple),18px 36px 0 var(--purple),36px 36px 0 var(--purple)}
.triangle{width:64px;height:60px;right:8vw;bottom:18vh}
.cross{width:46px;height:13px;right:24vw;top:13vh;background:var(--blue);
       border:2px solid var(--navy);border-radius:3px}
.cross::after{content:"";position:absolute;inset:-2px;background:var(--blue);
              border:2px solid var(--navy);border-radius:3px;transform:rotate(90deg)}
.card{position:relative;z-index:1;width:min(100%,440px);padding:34px 36px 30px;
      background:var(--white);border:2px solid var(--navy);border-radius:16px;
      box-shadow:var(--shadow)}
.logo{display:block;width:116px;height:auto;margin:0 auto 16px}
.auth-badge{display:flex;width:max-content;margin:0 auto 10px;padding:4px 12px;
     border:2px solid var(--navy);border-radius:999px;background:var(--lemon);
     font-size:.75rem;font-weight:800;letter-spacing:.08em}
h1{font-size:1.65rem;line-height:1.3;text-align:center;font-weight:800}
.sub{margin-top:7px;text-align:center;color:var(--muted);font-size:.875rem}
form{display:grid;gap:14px;margin-top:26px}
label{font-size:.8125rem;font-weight:800}
input{width:100%;min-height:46px;padding:11px 13px;border:2px solid var(--navy);
      border-radius:12px;background:var(--white);color:var(--navy);
      font:400 .9375rem var(--font)}
input::placeholder{color:var(--muted);opacity:1}
input:focus{box-shadow:4px 4px 0 var(--blue)}
:where(input,button,a):focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.btn{min-height:48px;margin-top:4px;border:2px solid var(--navy);border-radius:12px;
     background:var(--green);color:var(--navy);box-shadow:var(--shadow);cursor:pointer;
     font:800 1rem var(--font);transition:transform .16s ease,box-shadow .16s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--navy)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--navy)}
.err{margin-bottom:14px;padding:11px 13px;border:2px solid var(--navy);
     border-left:6px solid var(--danger);border-radius:10px;background:var(--coral);
     color:var(--navy);font-size:.8125rem;font-weight:700;text-align:left}
.err::before{content:"!";margin-right:7px;font-weight:800}
.tip{margin-top:22px;padding:12px 14px;border:2px solid var(--navy);border-radius:12px;
     background:var(--sky);color:var(--navy);text-align:center;font-size:.75rem;line-height:1.7}
.foot{margin-top:20px;padding-top:16px;border-top:2px solid var(--navy);
      color:var(--muted);text-align:center;font-size:.75rem;line-height:1.8}
code{padding:2px 6px;border:1px solid var(--navy);border-radius:6px;
     background:var(--lemon);color:var(--navy);font-family:Consolas,monospace}
@media(max-width:600px){
  body{padding:24px 16px}.card{padding:28px 22px 24px}.sun{width:58px;height:58px;right:18px;top:24px}
  .dots,.cross{display:none}.wave{left:-20px;bottom:20px}.triangle{right:12px;bottom:64px;width:48px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="decor" aria-hidden="true">
  <span class="geo sun"></span>
  <svg class="geo wave" viewBox="0 0 150 52" fill="none" aria-hidden="true">
    <path d="M3 29C14 7 27 7 38 29s24 22 35 0 24-22 35 0 24 22 38 0" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <span class="geo dots"></span>
  <svg class="geo triangle" viewBox="0 0 64 60" fill="none" aria-hidden="true">
    <path d="M32 4 61 55H3L32 4Z" fill="#FFB4AA" stroke="#27324A" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <span class="geo cross"></span>
</div>
<main class="card">
  <img class="logo" src="/static/logo.png" alt="ikee考务中心">
  <div class="auth-badge">HELLO, TEACHER</div>
  <h1>欢迎回到考务中心</h1>
  <p class="sub">老师端登录</p>

  {% if err %}<div class="err" role="alert">{{ err }}</div>{% endif %}

  <form method="post" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div>
      <label for="adminPassword">管理密码</label>
      <input id="adminPassword" type="password" name="password" placeholder="请输入管理密码"
             autocomplete="current-password" aria-describedby="loginTip" autofocus required>
    </div>
    <button class="btn" type="submit">登录</button>
  </form>

  <div class="tip" id="loginTip">学生机无需登录，直接运行客户端即可</div>

  <div class="foot">
    忘记密码？在服务器上执行：<br>
    <code>python3 src/ikeexam/server/auth.py --set "新密码"</code>
  </div>
</main>
</body>
</html>
